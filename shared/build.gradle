plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 19
        targetSdk = 37

        // Nissan Android 4.4 port: the BYD/wireless JNI helpers (I2C HUD, hotspot radio,
        // speex echo cancel) are removed; their Kotlin callers already handle LinkageError.
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
dependencies {
    // androidx.car.app removed: MyCarApp* projected-app classes are not part of the wired-only build.
    implementation libs.androidx.annotation
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}
